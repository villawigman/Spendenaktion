<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🎁 Artikelliste</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;min-height:100vh;background:#fdf6ee;color:#3d2b1f}
.page{padding:24px 16px 80px;max-width:1000px;margin:0 auto}
#notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:999px;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.25);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;background:#3d2b1f;color:#fdf6ee}
.header{text-align:center;margin-bottom:28px}
.pill{display:inline-block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:4px 14px;border-radius:999px;margin-bottom:12px;font-family:sans-serif;color:white;background:#c97d4e}
h1{font-size:clamp(24px,6vw,44px);font-weight:normal;margin-bottom:8px}
.subtitle{font-size:14px;font-style:italic;margin-bottom:10px;color:#8c6a52}
.stats{font-size:13px;font-family:sans-serif;margin-bottom:14px;color:#8c6a52}
.btn-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
button{cursor:pointer;font-family:Georgia,serif;border:none}
.name-card{border-radius:16px;padding:20px 24px;max-width:440px;margin:0 auto 24px;box-shadow:0 4px 20px rgba(0,0,0,.08);background:white;border:1.5px solid #e8d5c4}
.name-card p{font-size:16px;text-align:center;margin-bottom:12px}
.input-row{display:flex;gap:8px}
input{width:100%;padding:10px 14px;border-radius:10px;font-size:14px;font-family:Georgia,serif;outline:none;background:#fdf6ee;border:1.5px solid #e0c9b5;color:#333;margin-bottom:12px}
.welcome-bar{display:flex;justify-content:center;align-items:center;gap:12px;border-radius:12px;padding:10px 20px;max-width:360px;margin:0 auto 24px;font-size:14px;background:white;border:1px solid #e8d5c4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.07);background:white;border:1.5px solid #e8d5c4}
.card.mine{border:2px solid #c97d4e;background:#fff8f2;box-shadow:0 4px 20px rgba(201,125,78,.18)}
.card.taken{opacity:.65;background:#f8f4f0}
.card-img{width:100%;background:#f5ede4;display:flex;align-items:center;justify-content:center;padding:12px}
.card-img img{width:100%;height:auto;max-height:220px;object-fit:contain;display:block;border-radius:6px}
.card-emoji{width:100%;height:100px;display:flex;align-items:center;justify-content:center;font-size:44px;background:#f5e6d3}
.card-body{flex:1;padding:14px 16px 8px}
.card-name{font-size:17px;font-weight:normal;margin-bottom:5px;color:#3d2b1f}
.card-desc{font-size:12px;font-style:italic;line-height:1.4;margin-bottom:8px;color:#8c6a52}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.price-tag{font-size:11px;padding:3px 10px;border-radius:999px;font-family:sans-serif;background:#f5e6d3;color:#c97d4e}
.product-link{font-size:11px;padding:3px 10px;border-radius:999px;color:#5b7ec9;background:#eef2fb;text-decoration:none;font-family:sans-serif}
.card-footer{padding:10px 16px 14px}
.card-status{font-size:12px;margin-bottom:8px}
.card-actions{display:flex;gap:6px}
.btn-accent{color:white;border-radius:9px;padding:8px 14px;font-size:12px;flex:1;border:none;cursor:pointer}
.btn-outline{background:transparent;border-radius:9px;padding:8px 14px;font-size:12px;flex:1;cursor:pointer}
.btn-icon{padding:7px 9px;border-radius:8px;font-size:13px;background:transparent;border:1px solid #e8d5c4;cursor:pointer}
.add-card{border-radius:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px dashed #e8d5c4;color:#8c6a52}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9000;padding:16px;backdrop-filter:blur(4px);background:rgba(0,0,0,.45)}
.modal{background:white;border-radius:20px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:20px;font-weight:normal;margin-bottom:16px;color:#222}
.modal label{display:block;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-family:sans-serif}
.modal-btns{display:flex;gap:10px;margin-top:10px}
.btn-save{flex:1;padding:10px;border-radius:10px;border:none;color:white;font-family:Georgia,serif;font-weight:bold;cursor:pointer;font-size:14px}
.btn-cancel{flex:1;padding:10px;border-radius:10px;border:1.5px solid #e0c9b5;background:transparent;color:#888;font-family:Georgia,serif;cursor:pointer}
.err{color:#c0392b;font-size:12px;margin:-6px 0 10px;font-family:sans-serif}
.upload-box{border:2px dashed #e0c9b5;border-radius:10px;padding:14px;margin-bottom:12px;text-align:center;cursor:pointer;background:#fdf6ee}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 18px}
.swatch{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid #eee}
.swatch.active{border-width:2.5px}
.swatch-inner{padding:10px 8px 8px;text-align:center}
.swatch-dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px}
.swatch-name{font-size:11px;font-family:sans-serif}
.text-block{padding:16px;border-radius:12px;margin-bottom:4px;position:relative}
.font-btn{padding:5px 10px;border-radius:7px;border:1.5px solid #e0c9b5;background:#fdf6ee;cursor:pointer;font-family:Georgia,serif;margin:2px}
.font-btn.active{background:#c97d4e;color:white;border-color:#c97d4e}
select{width:100%;padding:9px 13px;border-radius:10px;font-size:14px;font-family:Georgia,serif;outline:none;background:#fdf6ee;border:1.5px solid #e0c9b5;color:#333;margin-bottom:12px;cursor:pointer}
textarea{width:100%;padding:10px 14px;border-radius:10px;font-size:14px;font-family:Georgia,serif;outline:none;background:#fdf6ee;border:1.5px solid #e0c9b5;color:#333;margin-bottom:12px;resize:vertical;min-height:80px}
.saving{display:inline-block;font-size:11px;padding:2px 12px;border-radius:999px;background:#f5e6d3;color:#c97d4e;font-family:sans-serif;margin-bottom:8px}
.hblock{padding:16px 24px;text-align:center;position:relative}
.hblock-edit{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.hblock:hover .hblock-edit{opacity:1}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.color-dot.active{border-color:#333}
.color-input{width:36px;height:36px;border:none;padding:0;cursor:pointer;border-radius:8px;background:none}
footer{text-align:center;margin-top:48px;font-size:11px;font-family:sans-serif;opacity:.4}
.cart-bar{position:fixed;bottom:0;left:0;right:0;z-index:8000;padding:12px 16px;font-family:Georgia,serif;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.cart-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cart-sum{font-size:18px;font-weight:bold}
.cart-items{font-size:12px;opacity:.8;font-family:sans-serif}
.bank-box{background:#f0f6ff;border:1.5px solid #c0d4f0;border-radius:12px;padding:16px;margin-bottom:16px}
.bank-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.bank-label{color:#888;font-family:sans-serif;font-size:12px}
.bank-value{font-weight:bold;font-family:monospace;font-size:14px}
.copy-btn{background:#3a6fd8;color:white;border:none;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:sans-serif}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ================================================================
// ⚙️ DEINE FIREBASE-KONFIGURATION — hier eintragen!
// ================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyAbv-K6HH9V8JVGc6q2kbz2kEqlNQoJXJY",
  authDomain:        "spendenaktion-8fb9b.firebaseapp.com",
  databaseURL:       "https://spendenaktion-8fb9b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "spendenaktion-8fb9b",
  storageBucket:     "spendenaktion-8fb9b.firebasestorage.app",
  messagingSenderId: "987845431856",
  appId:             "1:987845431856:web:f2ab90ede5f9781c8193f5"
};
// ================================================================

const THEMES={
  warm:{name:"🍂 Warm",bg:"#fdf6ee",ac:"#c97d4e",card:"#fff",text:"#3d2b1f",sub:"#8c6a52",tag:"#f5e6d3",brd:"#e8d5c4"},
  rose:{name:"🌸 Rosa",bg:"#fff5f7",ac:"#e05c8a",card:"#fff",text:"#3d1a24",sub:"#b06080",tag:"#fce4ec",brd:"#f0c8d8"},
  sage:{name:"🌿 Grün",bg:"#f3f8f4",ac:"#4a8c5c",card:"#fff",text:"#1a3324",sub:"#567a60",tag:"#d8eedf",brd:"#c0ddc8"},
  sky:{name:"🩵 Blau",bg:"#f0f6ff",ac:"#3a6fd8",card:"#fff",text:"#0d1f40",sub:"#4a6090",tag:"#dce8fa",brd:"#c0d4f0"},
  dark:{name:"🌑 Dunkel",bg:"#18181b",ac:"#f59e0b",card:"#27272a",text:"#f4f4f5",sub:"#a1a1aa",tag:"#3f3f46",brd:"#52525b"},
  candy:{name:"🍬 Candy",bg:"#fff9fe",ac:"#a855f7",card:"#fff",text:"#2e1a47",sub:"#7c3aed",tag:"#f3e8ff",brd:"#e0c8f8"}
};

let data={gifts:[],claims:{},adminPassword:"",design:{theme:"warm",headerText:"🎁 Artikelliste",headerSub:"Wähle ein Geschenk und markiere es als deins",bgUrl:""}};
let userName="",isAdmin=false,notifTimer=null,isSaving=false;
let db,dataRef;

// Admin-Session
function restoreAdmin(){try{const s=localStorage.getItem("gl-adm");if(s&&data.adminPassword&&s===data.adminPassword)isAdmin=true;}catch(e){}}
function saveAdmin(){try{localStorage.setItem("gl-adm",data.adminPassword);}catch(e){}}
function logoutAdmin(){
  isAdmin=false;
  try{localStorage.removeItem("gl-adm");}catch(e){}
  render();
}

// Prüfe ob Config eingetragen wurde
function configOk(){return firebaseConfig.apiKey!=="DEIN_API_KEY";}

async function init(){
  if(!configOk()){renderSetup();return;}
  showLoader();
  try{
    const app=initializeApp(firebaseConfig);
    db=getDatabase(app);
    dataRef=ref(db,"geschenkeliste");
    // Echtzeit-Updates
    onValue(dataRef,(snap)=>{
      const val=snap.val();
      if(val){
        data.gifts=val.gifts||[];
        data.claims=val.claims||{};
        data.adminPassword=val.adminPassword||"";
        data.design={...data.design,...(val.design||{})};
        data.headerBlocks=val.headerBlocks||[];
        data.headerImgs=val.headerImgs||[];
        data.textBlocks=val.textBlocks||[];
      }
      restoreAdmin();
      render();
      console.log("✅ Firebase verbunden!");
    },(error)=>{
      console.error("Firebase Fehler:",error);
      showNotif("❌ Verbindungsfehler: "+error.message);
    });
  }catch(e){
    document.getElementById("root").innerHTML=`<div style="text-align:center;padding:60px 20px;font-family:sans-serif;"><div style="font-size:36px;margin-bottom:12px;">⚠️</div><p style="color:#c0392b;font-size:16px;margin-bottom:6px;">Verbindungsfehler</p><p style="color:#888;font-size:13px;">${e.message}</p></div>`;
  }
}

async function saveData(){
  if(!dataRef){showNotif("❌ Keine Datenbankverbindung!");console.error("dataRef is null");return;}
  isSaving=true;renderSaving();
  try{
    await set(dataRef,data);
    console.log("✅ Gespeichert!");
  }catch(e){
    console.error("Speicherfehler:",e);
    showNotif("❌ Speicherfehler: "+e.message);
  }
  isSaving=false;renderSaving();
}

function renderSaving(){const el=document.getElementById("saving-badge");if(el)el.style.display=isSaving?"inline-block":"none";}
function showNotif(msg){const el=document.getElementById("notif");if(!el)return;const t=THEMES[data.design.theme]||THEMES.warm;el.style.background=t.text;el.style.color=t.bg;el.textContent=msg;el.style.opacity="1";clearTimeout(notifTimer);notifTimer=setTimeout(()=>{el.style.opacity="0";},2500);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function showLoader(){document.getElementById("root").innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;"><div style="width:44px;height:44px;border:3px solid #f0d9c8;border-top:3px solid #c97d4e;border-radius:50%;animation:spin .8s linear infinite;"></div><p style="font-family:Georgia,serif;color:#c97d4e;">Verbinde mit Datenbank...</p></div>`;}
function doSetName(){const v=(document.getElementById("nameInp")?.value||"").trim();if(v){userName=v;render();}}

async function doClaim(id){if(!userName){showNotif("Bitte gib deinen Namen ein!");return;}data.claims[id]=userName;await saveData();showNotif("🎉 Reserviert!");}
async function doUnclaim(id){delete data.claims[id];await saveData();showNotif("↩️ Freigegeben");}
async function doRemove(id){if(!confirm("Artikel entfernen?"))return;data.gifts=data.gifts.filter(g=>g.id!==id);delete data.claims[id];await saveData();showNotif("🗑️ Entfernt");}

function render(){
  const t=THEMES[data.design.theme]||THEMES.warm,d=data.design;
  const claimed=Object.keys(data.claims).length;
  document.body.style.background=d.bgUrl?`url(${d.bgUrl}) center/cover fixed`:t.bg;
  document.body.style.color=t.text;
  document.title=d.headerText||"Artikelliste";

  let adminHtml="";
  if(isAdmin){adminHtml=`<div style="display:inline-flex;align-items:center;gap:8px;background:${t.tag};border:1.5px solid ${t.ac};color:${t.ac};border-radius:999px;padding:5px 14px;font-size:12px;font-family:sans-serif;">👑 Admin<button onclick="logoutAdmin();" style="background:transparent;border:1px solid ${t.ac};border-radius:7px;padding:2px 8px;font-size:11px;color:${t.ac};cursor:pointer;">Abmelden</button></div><button onclick="openDesign();" style="background:${t.ac};color:white;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:bold;cursor:pointer;border:none;">🎨 Design</button><button onclick="openModal('bank');" style="background:${t.text};color:${t.bg};border-radius:999px;padding:8px 18px;font-size:13px;font-weight:bold;cursor:pointer;border:none;">🏦 Kontodaten</button>`;}
  else if(!data.adminPassword){adminHtml=`<button onclick="openModal('setpw');" style="background:${t.text};color:${t.bg};border-radius:999px;padding:8px 18px;font-size:13px;font-weight:bold;cursor:pointer;border:none;">🔐 Admin-Passwort festlegen</button>`;}
  else{adminHtml=`<button onclick="openModal('login');" style="background:transparent;color:${t.sub};border:1px solid ${t.brd};border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;border:1px solid ${t.brd};">🔑 Als Admin anmelden</button>`;}

  const nameBar=!userName
    ?`<div class="name-card"><p>Wie heißt du? 👋</p><div class="input-row"><input id="nameInp" placeholder="Dein Name..." style="margin-bottom:0;" onkeydown="if(event.key==='Enter')doSetName();"/><button onclick="doSetName();" style="background:${t.ac};color:white;white-space:nowrap;padding:9px 18px;border-radius:10px;font-weight:bold;font-size:14px;border:none;">Los!</button></div></div>`
    :`<div class="welcome-bar">👤 Hallo, <strong>${esc(userName)}</strong>!<button onclick="userName='';render();" style="background:transparent;border:1px solid ${t.brd};border-radius:7px;padding:3px 10px;font-size:11px;color:${t.sub};cursor:pointer;">Wechseln</button></div>`;

  // Combine gifts and text blocks, sorted by order
const allItems=[...data.gifts.map(g=>({...g,_type:'gift'})),...(data.textBlocks||[]).map(b=>({...b,_type:'text'}))].sort((a,b)=>(a.order||0)-(b.order||0));
const cards=allItems.map(item=>{
  if(item._type==='text'){
    const fonts={'Georgia,serif':'Georgia','Arial,sans-serif':'Arial','Verdana,sans-serif':'Verdana','Courier New,monospace':'Courier','Palatino,serif':'Palatino'};
    const editBtn=isAdmin?`<button class="btn-icon" onclick="openModal('text','${item.id}');" style="position:absolute;top:8px;right:36px;border:1px solid ${t.brd};">✏️</button><button class="btn-icon" onclick="doRemoveText('${item.id}');" style="position:absolute;top:8px;right:4px;border:1px solid ${t.brd};">🗑️</button>`:'';
    return `<div class="text-block" style="background:${t.card};border:1.5px solid ${t.brd};grid-column:1/-1;${editBtn?'padding-right:80px;':''}">${editBtn}<p style="font-family:${item.fontFamily||'Georgia,serif'};font-size:${item.fontSize||'16px'};font-weight:${item.bold?'bold':'normal'};font-style:${item.italic?'italic':'normal'};color:${t.text};white-space:pre-wrap;line-height:1.6;">${esc(item.text||'')}</p></div>`;
  }
const g=item;
    const claimer=data.claims[g.id],isMine=claimer===userName,isTaken=!!claimer&&!isMine;
    const cardBgColor=isMine?t.tag:isTaken?"#f8f4f0":(g.cardBg||t.card);
    let imgHtml=g.imageUrl?`<div class="card-img" style="background:${g.imgBg||'#f5ede4'};"><img src="${esc(g.imageUrl)}" alt="${esc(g.name)}"/></div>`:`<div class="card-emoji" style="background:${g.imgBg||'#f5e6d3'};">${esc(g.emoji||"🎁")}</div>`;
    let meta="";
    if(g.price)meta+=`<span class="price-tag">${esc(g.price)}</span>`;
    if(g.productUrl)meta+=`<a class="product-link" href="${esc(g.productUrl)}" target="_blank">🔗 Zum Produkt</a>`;
    let status=isMine?`<div class="card-status" style="color:${t.ac};font-weight:bold;">✅ Du spendest das!</div>`:isTaken?`<div class="card-status" style="color:${t.sub};">🔒 ${esc(claimer)} spendet das</div>`:`<div class="card-status" style="color:#4caf79;">✨ Noch frei</div>`;
    let acts="";
    if(!claimer&&userName)acts+=`<button class="btn-accent" onclick="doClaim(${g.id});" style="background:${t.ac};">Ich spende das!</button>`;
    if(isMine)acts+=`<button class="btn-outline" onclick="doUnclaim(${g.id});" style="border:1.5px solid ${t.ac};color:${t.ac};">Freigeben</button>`;
    if(isAdmin){acts+=`<button class="btn-icon" onclick="openModal('gift',${g.id});">✏️</button>`;acts+=`<button class="btn-icon" onclick="doRemove(${g.id});">🗑️</button>`;}
    // Pick readable text color based on card bg brightness
const hex=(g.cardBg||'#ffffff').replace('#','');
const r=parseInt(hex.substr(0,2),16),gg=parseInt(hex.substr(2,2),16),b2=parseInt(hex.substr(4,2),16);
const brightness=(r*299+gg*587+b2*114)/1000;
const autoTextColor=brightness<128?'#ffffff':'#3d2b1f';
const cardTextColor=g.textColor||autoTextColor;
const cardFont=g.fontFamily||'Georgia,serif';
return `<div class="card${isMine?" mine":isTaken?" taken":""}" style="background:${cardBgColor};font-family:${cardFont};">${imgHtml}<div class="card-body"><div class="card-name" style="color:${cardTextColor};">${esc(g.name)}</div>${g.description?`<div class="card-desc" style="color:${g.textColor?(g.textColor+'cc'):brightness<128?'rgba(255,255,255,0.8)':'#8c6a52'};">${esc(g.description)}</div>`:""}<div class="card-meta">${meta}</div></div><div class="card-footer">${status}<div class="card-actions">${acts}</div></div></div>`;
  }).join("")+(isAdmin?`<div class="add-card" onclick="openModal('gift',0);"><div style="font-size:32px;color:${t.ac};margin-bottom:6px;">+</div><div style="font-size:13px;font-style:italic;">Artikel hinzufügen</div></div><div class="add-card" onclick="openModal('text',0);" style="border-color:${t.brd};color:${t.sub};"><div style="font-size:32px;color:${t.ac};margin-bottom:6px;">T</div><div style="font-size:13px;font-style:italic;">Textblock hinzufügen</div></div>`:"");

  // Render header blocks
  // Combine text and image header blocks by order
  const allHeaderBlocks=[...(data.headerBlocks||[]).map(b=>({...b,_htype:'text'})),...(data.headerImgs||[]).map(b=>({...b,_htype:'img'}))].sort((a,b)=>(a.order||0)-(b.order||0));
  const hblocks=allHeaderBlocks.map((b)=>{
    if(b._htype==='img'){
      const editBtns=isAdmin?`<div class="hblock-edit"><button class="btn-icon" onclick="openModal('himg','${b.id}');" style="background:white;font-size:12px;">✏️</button><button class="btn-icon" onclick="removeHImg('${b.id}');" style="background:white;font-size:12px;">🗑️</button></div>`:'';
      const imgs=b.images||[];
      const h=b.imgHeight||'200px';
      const rounded=b.rounded?'12px':'4px';
      let galleryHtml='';
      if(b.layout==='grid'){

function handleHImgUpload(input){
  const files=Array.from(input.files);if(!files.length)return;
  const loading=document.getElementById("m-hi-loading"),lbl=document.getElementById("m-hi-lbl");
  if(loading)loading.style.display="block";
  let processed=0;
  const existing=JSON.parse(document.getElementById("m-hiimgs")?.value||"[]");
  const newImgs=[...existing];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        newImgs.push(canvas.toDataURL("image/jpeg",.8));
        processed++;
        if(processed===files.length){
          document.getElementById("m-hiimgs").value=JSON.stringify(newImgs);
          if(loading)loading.style.display="none";
          if(lbl)lbl.textContent=`✅ ${newImgs.length} Bild(er) ausgewählt`;
          // Update preview
          const prev=document.getElementById("m-hiprev");
          if(prev)prev.innerHTML=newImgs.map((src,i)=>`<div style="position:relative;display:inline-block;margin:4px;"><img src="${src}" style="height:80px;width:auto;object-fit:cover;border-radius:6px;border:1px solid #ddd;"/><button onclick="removeHImgItem(${i});" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;">✕</button></div>`).join('');
        }
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const loading=document.getElementById("m-img-loading"),prev=document.getElementById("m-imgprev"),lbl=document.getElementById("m-upload-lbl");
  if(loading)loading.style.display="block";if(prev)prev.style.display="none";
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=500;let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const b64=canvas.toDataURL("image/jpeg",.7);
      document.getElementById("m-gimg").value=b64;
      document.getElementById("m-imgprev-img").src=b64;
      if(prev)prev.style.display="";if(loading)loading.style.display="none";
      if(lbl)lbl.textContent="✅ Foto ausgewählt";
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
function clearUpload(){document.getElementById("m-gimg").value="";document.getElementById("m-imgprev").style.display="none";document.getElementById("m-upload-lbl").textContent="📁 JPG oder PNG auswählen";document.getElementById("m-gfile").value="";}

async function doLogin(){const pw=document.getElementById("m-pw")?.value||"";if(pw===data.adminPassword){isAdmin=true;saveAdmin();closeModal();render();showNotif("👑 Willkommen, Admin!");}else document.getElementById("m-err").textContent="Falsches Passwort!";}

async function doSaveGift(){const name=(document.getElementById("m-gname")?.value||"").trim();if(!name){showNotif("Bitte Namen eingeben!");return;}const gid=document.getElementById("m-gid")?.value;const gift={id:gid?parseInt(gid):Date.now(),name,emoji:document.getElementById("m-gemoji")?.value||"🎁",price:document.getElementById("m-gprice")?.value||"",description:document.getElementById("m-gdesc")?.value||"",imageUrl:document.getElementById("m-gimg")?.value||"",productUrl:document.getElementById("m-glink")?.value||"",cardBg:document.getElementById("m-gcardBg")?.value||"#ffffff",textColor:document.getElementById("m-gtextColor")?.value||"",imgBg:document.getElementById("m-gimgBg")?.value||"#f5ede4",fontFamily:document.getElementById("m-gfont")?.value||"Georgia,serif"};if(gid){data.gifts=data.gifts.map(g=>g.id===parseInt(gid)?gift:g);showNotif("Artikel aktualisiert!");}else{data.gifts.push(gift);showNotif("Artikel hinzugefügt!");}closeModal();await saveData();}

function selTheme(k){data.design.theme=k;document.querySelectorAll(".swatch").forEach(el=>{const key=el.id.replace("sw-","");el.classList.toggle("active",key===k);el.style.borderColor=key===k?THEMES[key].ac:"#eee";});}
